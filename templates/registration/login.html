{% extends "base.html" %}
{% block title %}Iniciar sesión · PoliDrive{% endblock %}

{% block auth_content %}
<div class="login-split">

    <div class="login-aside">
        <div class="login-aside-body">
            <h1 class="login-hero">Poli Drive</h1>
        </div>
    </div>

    <div class="login-main">
        <div class="brand">Poli<span class="brand-mark">Drive</span></div>

        <div class="login-box">
            <h2>Bienvenido</h2>
            <p class="login-sub">¿No tienes cuenta? <a href="{% url 'register' %}">Regístrate</a></p>

            <form method="post" class="login-form">
                {% csrf_token %}
                {{ form.as_p }}
                <button type="submit" class="btn primary login-btn">Entrar</button>
            </form>
        </div>
    </div>

</div>
{% endblock %}
